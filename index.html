<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas OPSI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-blue-900 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <img src="logo.png" alt="Logo OPSI" class="w-8 h-8 object-contain rounded-md bg-white p-0.5">
          <span>Kas OPSI</span>
        </h1>
        <p class="text-xs text-blue-200">Transparansi Keuangan Desa</p>
      </div>
      <div>
        <button id="authBtn" onclick="toggleAuthModal()" class="bg-blue-800 hover:bg-blue-700 text-xs font-semibold px-4 py-2 rounded-lg transition border border-blue-700 flex items-center gap-2">
          <i data-lucide="lock" class="w-4 h-4"></i> <span id="authBtnText">Login Admin</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">
    <!-- Card Ringkasan -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-500 tracking-wider">Total Saldo Kas</p>
          <h2 id="totalSaldo" class="text-2xl font-black text-blue-900 mt-1">Memuat...</h2>
        </div>
        <div class="p-3 bg-blue-50 text-blue-800 rounded-lg"><i data-lucide="coins" class="w-7 h-7"></i></div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-500 tracking-wider">Total Pemasukan</p>
          <h2 id="totalPemasukan" class="text-2xl font-bold text-emerald-600 mt-1">Rp 0</h2>
        </div>
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="arrow-down-left" class="w-7 h-7"></i></div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-500 tracking-wider">Total Pengeluaran</p>
          <h2 id="totalPengeluaran" class="text-2xl font-bold text-rose-600 mt-1">Rp 0</h2>
        </div>
        <div class="p-3 bg-rose-50 text-rose-600 rounded-lg"><i data-lucide="arrow-up-right" class="w-7 h-7"></i></div>
      </div>
    </section>

    <!-- Panel Admin -->
    <section id="adminPanel" class="hidden bg-blue-50 border border-blue-200 p-4 rounded-xl flex justify-between items-center">
      <div class="flex items-center gap-2 text-blue-900 font-semibold text-sm">
        <i data-lucide="shield-check" class="w-5 h-5 text-blue-700"></i> Mode Bendahara Aktif
      </div>
      <button onclick="openModalTambah()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-1 shadow-sm transition">
        <i data-lucide="plus" class="w-4 h-4"></i> Tambah Transaksi
      </button>
    </section>

    <!-- Tabel Transaksi -->
    <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center flex-wrap gap-2">
        <h3 class="font-bold text-slate-700">Riwayat Transaksi</h3>
        <button onclick="getKasData()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-3 h-3"></i> Segarkan Data
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-100 uppercase text-slate-500 font-semibold border-b border-slate-200">
            <tr>
              <th class="p-3">Tanggal</th>
              <th class="p-3">Keterangan</th>
              <th class="p-3">Jenis</th>
              <th class="p-3 text-right">Nominal</th>
              <th id="thAksi" class="p-3 text-center hidden">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <tr><td colspan="5" class="p-4 text-center">Memuat data dari Google Sheets...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal Login -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex justify-center items-center p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl relative">
      <h3 class="font-bold text-lg text-slate-800 mb-4">Login Bendahara</h3>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Password / PIN</label>
          <input type="password" id="loginPassword" placeholder="Masukkan password admin" required class="w-full border rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
          <p class="text-[10px] text-slate-400 mt-1">Default password: admin123</p>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="toggleAuthModal()" class="px-3 py-1.5 text-xs text-slate-500">Batal</button>
          <button type="submit" class="px-4 py-1.5 bg-blue-900 text-white rounded-lg text-xs font-bold hover:bg-blue-800">Login</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Tambah Transaksi -->
  <div id="tambahModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex justify-center items-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative">
      <h3 class="font-bold text-lg text-slate-800 mb-4">Catat Transaksi Baru</h3>
      <form onsubmit="handleTambahTransaksi(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Tanggal</label>
          <input type="date" id="inputTanggal" required class="w-full border rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Jenis Transaksi</label>
          <select id="inputJenis" required class="w-full border rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
            <option value="pemasukan">Pemasukan (Kas Masuk)</option>
            <option value="pengeluaran">Pengeluaran (Kas Keluar)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Keterangan</label>
          <input type="text" id="inputKeterangan" placeholder="Contoh: Iuran Bulanan" required class="w-full border rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Nominal (Rp)</label>
          <input type="number" id="inputNominal" min="1" placeholder="50000" required class="w-full border rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModalTambah()" class="px-3 py-1.5 text-xs text-slate-500">Batal</button>
          <button type="submit" id="btnSimpan" class="px-4 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-700">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    // ==============================================================
    // GANTI URL DI BAWAH INI DENGAN WEB APP URL DARI GOOGLE SCRIPT KAMU
    // ==============================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyTL7lDegpBlOCASHX_0rhQJl7ERyByqxvQm_8GkN1RyyrMhvyhC0iiNx65GGfIy0NIkA/exec"; 

    let allData = [];
    let isAdmin = false; // Status login

    const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputTanggal').valueAsDate = new Date();
      getKasData();
    });

    // 1. AMBIL DATA DARI GOOGLE SHEETS
    async function getKasData() {
      const tbody = document.getElementById('tableBody');
      try {
        const response = await fetch(GAS_URL);
        const result = await response.json();
        
        if (result.status === "success") {
          allData = result.data.reverse(); // Balik urutan agar yang terbaru di atas
          calculateSummary();
          renderTable();
        }
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-500">Gagal memuat data. Periksa koneksi atau URL Script.</td></tr>`;
      }
    }

    // 2. HITUNG TOTAL SALDO
    function calculateSummary() {
      let masuk = 0, keluar = 0;
      allData.forEach(item => {
        if (item.jenis === 'pemasukan') masuk += Number(item.nominal);
        else if (item.jenis === 'pengeluaran') keluar += Number(item.nominal);
      });
      document.getElementById('totalPemasukan').innerText = formatRp(masuk);
      document.getElementById('totalPengeluaran').innerText = formatRp(keluar);
      document.getElementById('totalSaldo').innerText = formatRp(masuk - keluar);
    }

    // 3. TAMPILKAN KE TABEL HTML
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (allData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada data transaksi.</td></tr>`;
        return;
      }

      allData.forEach(item => {
        const isMasuk = item.jenis === 'pemasukan';
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 border-b border-slate-100";
        tr.innerHTML = `
          <td class="p-3">${item.tanggal}</td>
          <td class="p-3 font-medium">${item.keterangan}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${isMasuk ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
              ${item.jenis}
            </span>
          </td>
          <td class="p-3 text-right font-bold ${isMasuk ? 'text-emerald-600' : 'text-rose-600'}">
            ${isMasuk ? '+' : '-'} ${formatRp(item.nominal)}
          </td>
          ${isAdmin ? `
            <td class="p-3 text-center">
              <button onclick="hapusTransaksi(${item.rowNumber})" class="text-rose-500 hover:text-rose-700 bg-rose-50 p-1.5 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </td>
          ` : ''}
        `;
        tbody.appendChild(tr);
      });
      lucide.createIcons();
    }

    // 4. TAMBAH TRANSAKSI
    async function handleTambahTransaksi(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const payload = {
        action: "ADD",
        tanggal: document.getElementById('inputTanggal').value,
        jenis: document.getElementById('inputJenis').value,
        keterangan: document.getElementById('inputKeterangan').value,
        nominal: Number(document.getElementById('inputNominal').value)
      };

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        closeModalTambah();
        e.target.reset();
        document.getElementById('inputTanggal').valueAsDate = new Date();
        await getKasData(); // Refresh Data
        alert(result.message);
      } catch (error) {
        alert("Gagal menyimpan data.");
      } finally {
        btn.innerText = "Simpan Data";
        btn.disabled = false;
      }
    }

    // 5. HAPUS TRANSAKSI
    async function hapusTransaksi(rowNumber) {
      if (!confirm("Yakin ingin menghapus catatan transaksi ini?")) return;

      const payload = { action: "DELETE", rowNumber: rowNumber };

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        await getKasData();
        alert(result.message);
      } catch (error) {
        alert("Gagal menghapus data.");
      }
    }

    // --- LOGIKA LOGIN SEDERHANA ---
    function toggleAuthModal() {
      if (isAdmin) {
        isAdmin = false; // Proses Logout
        checkAuthUI();
      } else {
        document.getElementById('loginModal').classList.remove('hidden');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const pw = document.getElementById('loginPassword').value;
      // Password sederhana untuk KKN (bisa diganti)
      if (pw === 'admin123') {
        isAdmin = true;
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('loginPassword').value = '';
        checkAuthUI();
      } else {
        alert("Password Salah!");
      }
    }

    function checkAuthUI() {
      const adminPanel = document.getElementById('adminPanel');
      const thAksi = document.getElementById('thAksi');
      const authBtnText = document.getElementById('authBtnText');

      if (isAdmin) {
        adminPanel.classList.remove('hidden');
        thAksi.classList.remove('hidden');
        authBtnText.innerText = 'Logout Admin';
      } else {
        adminPanel.classList.add('hidden');
        thAksi.classList.add('hidden');
        authBtnText.innerText = 'Login Admin';
      }
      renderTable(); // Render ulang agar tombol hapus muncul/hilang
    }

    function openModalTambah() { document.getElementById('tambahModal').classList.remove('hidden'); }
    function closeModalTambah() { document.getElementById('tambahModal').classList.add('hidden'); }

  </script>
</body>
</html>
